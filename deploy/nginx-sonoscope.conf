# Include inside the existing HTTPS server{} for the chosen site.
# Keep the site's other locations unchanged. Upstream retains /SonoScope (no trailing slash).
location = /SonoScope {
    # Only the existing public-domain proxy may supply the client address.
    set_real_ip_from 47.103.120.24;
    real_ip_header X-Real-IP;
    real_ip_recursive off;
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 15s;
}
location ^~ /SonoScope/ {
    set_real_ip_from 47.103.120.24;
    real_ip_header X-Real-IP;
    real_ip_recursive off;
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 15s;
    client_max_body_size 12k;
}
