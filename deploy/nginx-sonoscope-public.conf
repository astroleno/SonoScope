# Include in both existing HTTPS server{} blocks on the public domain server.
# Keep the public Host in the browser; the Tencent upstream uses its own TLS name.
location = /SonoScope {
    proxy_pass https://aitoshuu.art;
    proxy_ssl_server_name on;
    proxy_ssl_name aitoshuu.art;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_set_header Host aitoshuu.art;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 15s;
}
location ^~ /SonoScope/ {
    proxy_pass https://aitoshuu.art;
    proxy_ssl_server_name on;
    proxy_ssl_name aitoshuu.art;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_set_header Host aitoshuu.art;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 15s;
    client_max_body_size 12k;
}
