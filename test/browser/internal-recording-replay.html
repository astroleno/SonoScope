<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SonoScope 录播集成检查</title>
<style>
body{margin:0;background:#0a0a0f;color:white;font:15px system-ui}header,footer{position:relative;z-index:2;padding:20px;background:#0a0a0f}button{min-height:44px;padding:10px 16px;font:inherit}#layer{position:fixed;inset:0;overflow:hidden;pointer-events:none}.danmu-comment{position:absolute;max-width:calc(100vw - 32px);padding:8px 12px;background:#16161d;color:white;font-size:16px;white-space:normal;overflow-wrap:anywhere;width:max-content}footer{position:fixed;bottom:0;left:0;right:0}pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:20px;padding-bottom:80px}
</style>
<header><h1>录播集成检查</h1><p>生成测试音和标记弹幕，不读取麦克风。检查原生编码、两种存储、20 次启停、定位及备份恢复；不作为声音质量或手机性能成绩。</p><button id="run">运行约 45 秒检查</button></header>
<div id="layer" aria-hidden="true"></div><pre id="result">等待操作</pre><footer id="progress" role="status">检查期间请保持页面在前台。</footer>
<script type="module" src="./dist/internal-recording-replay.js"></script>
</html>
