<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>SonoScope recording capability probe</title>
<style>body{font:16px system-ui;max-width:900px;margin:32px auto;padding:20px}button{font:inherit;padding:12px}pre{white-space:pre-wrap}</style>
<h1>录播能力检查</h1><p>仅生成测试音，不读取麦克风。检查编码、落盘、重开和定位。</p>
<button id="run">运行 5 秒测试</button><pre id="result">等待操作</pre>
<audio controls id="audio"></audio>
<script type="module">
const output=document.querySelector('#result'), player=document.querySelector('#audio');
window.probeResult=null;
document.querySelector('#run').onclick=async()=>{
 const result={startedAt:new Date().toISOString(),userAgent:navigator.userAgent,secureContext:isSecureContext,formats:[],chunks:[],errors:[]};
 let context,oscillator,url,recorder,store;
 const deadline=(promise,ms=10000)=>Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(new Error('Probe deadline')),ms))]);
 try{
  context=new AudioContext();await context.resume();
  result.formats=['audio/mp4;codecs=mp4a.40.2','audio/webm;codecs=opus','audio/ogg;codecs=opus','audio/mp4','audio/webm'].map(mime=>({mime,supported:MediaRecorder.isTypeSupported(mime)}));
  const mime=result.formats.find(x=>x.supported)?.mime;if(!mime)throw new Error('No recording format');
  const destination=context.createMediaStreamDestination(), gain=context.createGain();
  oscillator=context.createOscillator();oscillator.frequency.value=440;oscillator.connect(gain);gain.connect(destination);
  const start=context.currentTime;gain.gain.setValueAtTime(0,start);gain.gain.setValueAtTime(.2,start+.5);gain.gain.setValueAtTime(0,start+1);gain.gain.setValueAtTime(.2,start+2.5);gain.gain.setValueAtTime(0,start+3);oscillator.start();
  recorder=new MediaRecorder(destination.stream,{mimeType:mime,audioBitsPerSecond:96000});
  const chunks=[], stopped=new Promise((resolve,reject)=>{recorder.onstop=resolve;recorder.onerror=e=>reject(e.error??new Error('Recorder error'));});
  recorder.ondataavailable=e=>{if(e.data.size){chunks.push(e.data);result.chunks.push({bytes:e.data.size,eventTime:e.timeStamp,contextTime:context.currentTime-start});}};
  recorder.start(1000);await new Promise(resolve=>setTimeout(resolve,5000));result.sourceDuration=context.currentTime-start;recorder.stop();await deadline(stopped);
  const blob=new Blob(chunks,{type:recorder.mimeType});result.mime=recorder.mimeType;result.bytes=blob.size;
  const decoded=await context.decodeAudioData(await blob.arrayBuffer());result.decodedDuration=decoded.duration;
  const pcm=decoded.getChannelData(0);result.firstSoundSeconds=pcm.findIndex(v=>Math.abs(v)>.05)/decoded.sampleRate;
  const root=await navigator.storage.getDirectory(), directory=await root.getDirectoryHandle('sonoscope-recording-probe',{create:true});
  const file=await directory.getFileHandle('probe-audio',{create:true});
  if(file.createWritable){const writer=await file.createWritable();await writer.write(blob);await writer.close();result.opfs='async-write';}
  else{
   const workerUrl=URL.createObjectURL(new Blob([`onmessage=async(e)=>{try{const r=await navigator.storage.getDirectory(),d=await r.getDirectoryHandle('sonoscope-recording-probe'),f=await d.getFileHandle('probe-audio'),a=await f.createSyncAccessHandle();let pos=0;for await(const b of e.data.stream()){pos+=a.write(b,{at:pos});}a.flush();a.close();postMessage({ok:true,bytes:pos});}catch(x){postMessage({ok:false,error:String(x)});}}`],{type:'text/javascript'}));
   const worker=new Worker(workerUrl);try{const saved=await deadline(new Promise((resolve,reject)=>{worker.onmessage=e=>e.data.ok?resolve(e.data):reject(new Error(e.data.error));worker.onerror=reject;worker.postMessage(blob);}));result.opfs=saved;}finally{worker.terminate();URL.revokeObjectURL(workerUrl);}
  }
  const reopened=await file.getFile();result.reopenedBytes=reopened.size;
  const loaded=new Promise((resolve,reject)=>{player.onloadedmetadata=resolve;player.onerror=()=>reject(new Error('Media load failed'));});url=URL.createObjectURL(reopened);player.src=url;await deadline(loaded);result.initialDuration=String(player.duration);
  const seeked=new Promise((resolve,reject)=>{player.onseeked=resolve;player.onerror=()=>reject(new Error('Seek failed'));});player.currentTime=2.5;await deadline(seeked);result.seekPosition=player.currentTime;result.seekable=Array.from({length:player.seekable.length},(_,i)=>[player.seekable.start(i),player.seekable.end(i)]);
  store=await new Promise((resolve,reject)=>{const request=indexedDB.open('sonoscope-recording-probe',1);request.onupgradeneeded=()=>request.result.createObjectStore('metadata');request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error);});
  await new Promise((resolve,reject)=>{const transaction=store.transaction('metadata','readwrite');transaction.objectStore('metadata').put({bytes:blob.size},'probe');transaction.oncomplete=resolve;transaction.onerror=()=>reject(transaction.error);});
  result.indexedDB=true;result.storage=await navigator.storage.estimate();await directory.removeEntry('probe-audio');result.cleanup=true;
 }catch(error){result.errors.push(String(error));}finally{if(recorder?.state==='recording')recorder.stop();oscillator?.stop();await context?.close();store?.close();if(url){player.removeAttribute('src');player.load();URL.revokeObjectURL(url);}window.probeResult=result;output.textContent=JSON.stringify(result,null,2);}
};
</script></html>
